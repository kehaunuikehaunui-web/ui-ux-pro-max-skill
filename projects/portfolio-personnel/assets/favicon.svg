<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Monogramme : remplacez « VN » par vos initiales. -->
  <style>
    .fond { fill: #18181B; }
    .lettres { fill: #FAFAFA; }
    .point { fill: #60A5FA; }
    @media (prefers-color-scheme: dark) {
      .fond { fill: #FAFAFA; }
      .lettres { fill: #18181B; }
      .point { fill: #2563EB; }
    }
  </style>
  <rect class="fond" width="64" height="64"/>
  <text class="lettres" x="29" y="42" text-anchor="middle" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-1.5">VN</text>
  <rect class="point" x="50" y="36" width="6" height="6"/>
</svg>
